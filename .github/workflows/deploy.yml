name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Cek folder public_html ==="
            ls -la /home/clingdental_kasirftp/public_html/

            echo "=== Cek folder home ==="
            ls -la /home/clingdental_kasirftp/

            echo "=== Cari file deploy.sh dimanapun ==="
            find /home/clingdental_kasirftp -iname "*deploy*"

