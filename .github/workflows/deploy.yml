name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Sync Laravel App Files
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            app/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/app/

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            routes/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/routes/

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            resources/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/resources/

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            database/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/database/

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            config/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/config/

          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            composer.json composer.lock ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clingdental/web/kasir.clingdental.com/public_html/

      - name: ⚙️ Run Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/clingdental/web/kasir.clingdental.com/public_html
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
