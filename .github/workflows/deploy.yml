name: Deploy to VPS

on:
  push:
    branches:
      - main   # ganti kalau branch production kamu beda, misal 'master' atau 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            bash /home/clingdental_kasirftp/public_html/deploy.sh
